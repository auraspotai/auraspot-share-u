  <meta name="apple-itunes-app" content="app-id=6760815307">

  <meta name="twitter:card" content="summary_large_image">

  <script>
    (function () {
      const androidUrl = "https://play.google.com/store/apps/details?id=com.ybong.mdai&hl=en";
      const webUrl = "https://auraspot.kr/home.html";

      const userAgent =
        navigator.userAgent ||
        navigator.vendor ||
        window.opera ||
        "";

      const isAndroid = /android/i.test(userAgent);
      const isIOSDevice = /iPhone|iPad|iPod/i.test(userAgent);
      const isIPadOS =
        (navigator.platform === "MacIntel" || /Macintosh/i.test(userAgent)) &&
        navigator.maxTouchPoints > 1;

      if (isAndroid) {
        window.location.replace(androidUrl);
        return;
      }

      if (isIOSDevice || isIPadOS) {
        document.documentElement.classList.add("ios-mode");
        return;
      }

      window.location.replace(webUrl);
    })();
  </script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 15%, rgba(110, 180, 255, 0.17), transparent 35%),
        radial-gradient(circle at 80% 20%, rgba(192, 132, 252, 0.17), transparent 34%),
        #f7f8fb;
      color: #24282b;
    }

    .redirect-screen {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 20px;
      border: 3px solid rgba(96, 112, 255, 0.12);
      border-top-color: #7667e8;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .redirect-title {
      font-size: 18px;
      font-weight: 800;
    }

    .redirect-description {
      margin-top: 8px;
      color: #858b91;
      font-size: 13px;
      line-height: 1.6;
    }

    .ios-screen {
      display: none;
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .ios-mode .redirect-screen { display: none; }
    .ios-mode .ios-screen { display: block; }

    .card {
      overflow: hidden;
      background: rgba(255,255,255,.92);
      border-radius: 26px;
      box-shadow: 0 18px 60px rgba(55,65,90,.13);
    }

    .hero {
      display: block;
      width: 100%;
      aspect-ratio: 1792 / 877;
      object-fit: cover;
    }

    .content { padding: 24px 20px 22px; }

    .logo {
      font-size: 29px;
      font-weight: 850;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #27b779, #2997ea, #8758e8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    h1 {
      margin: 12px 0 8px;
      font-size: 21px;
      line-height: 1.35;
    }

    .sub {
      margin: 0 0 21px;
      color: #7c838a;
      font-size: 14px;
      line-height: 1.6;
    }

    .app-button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      width: 100%;
      color: #fff;
      background: #17191c;
      border-radius: 16px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
    }

    .web-link {
      display: inline-block;
      margin-top: 17px;
      color: #7a8287;
      font-size: 12px;
      font-weight: 650;
      text-decoration: none;
    }

    .copyright {
      margin-top: 16px;
      color: #a3a8ac;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <main class="redirect-screen">
    <div class="spinner"></div>
    <div class="redirect-title">
      Taking you to AuraSpot ✨
    </div>
    <div class="redirect-description">
      We're automatically directing you to<br>
      the best AuraSpot experience for your device.
    </div>
  </main>

  <main class="ios-screen">
    <section class="card">
      <img
        class="hero"
        src="https://u.auraspot.kr/share.webp"
        alt="AuraSpot - Discover Your Daily Fortune"
      >

      <div class="content">
        <div class="logo">AuraSpot</div>

        <h1>What kind of luck is coming your way?</h1>

        <p class="sub">
          Discover your daily fortune and lucky signs<br>
          with AuraSpot.
        </p>

        <a
          class="app-button"
          href="https://apps.apple.com/app/id6760815307"
        >
          Download on the App Store
        </a>

        <a
          class="web-link"
          href="https://app.auraspot.kr/"
        >
          Continue on the Web
        </a>
      </div>
    </section>

    <div class="copyright">© AuraSpot</div>
  </main>
</body>
</html>
